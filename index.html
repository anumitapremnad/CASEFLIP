<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaseFlip — Text Case Converter</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --accent: #e8f55e;
    --accent-dim: #c8d844;
    --text: #f0f0f0;
    --muted: #777;
    --radius: 12px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  header h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2.5rem, 8vw, 5rem);
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 1;
  }

  header h1 span {
    color: var(--accent);
  }

  header p {
    color: var(--muted);
    font-size: 13px;
    margin-top: 10px;
    letter-spacing: 0.05em;
  }

  .card {
    width: 100%;
    max-width: 740px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
  }

  .label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    line-height: 1.75;
    padding: 16px;
    resize: vertical;
    min-height: 140px;
    outline: none;
    transition: border-color 0.2s;
  }

  textarea:focus {
    border-color: var(--accent);
  }

  textarea::placeholder { color: #444; }

  .buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 20px 0;
  }

  button {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.05em;
    cursor: pointer;
    border-radius: 8px;
    padding: 9px 16px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    transition: all 0.15s ease;
  }

  button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  button.active, button:active {
    background: var(--accent);
    color: #0d0d0d;
    border-color: var(--accent);
  }

  button.danger {
    color: #ff6b6b;
    border-color: #ff6b6b33;
  }

  button.danger:hover {
    background: #ff6b6b22;
    border-color: #ff6b6b;
    color: #ff6b6b;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 20px 0;
  }

  .output-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .output-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    font-size: 14px;
    line-height: 1.75;
    min-height: 60px;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    transition: border-color 0.2s;
  }

  .output-box.has-content {
    border-color: #333;
  }

  .copy-btn {
    background: var(--accent);
    color: #0d0d0d;
    border-color: var(--accent);
    padding: 7px 14px;
    font-size: 11px;
  }

  .copy-btn:hover {
    background: var(--accent-dim);
    border-color: var(--accent-dim);
    color: #0d0d0d;
  }

  .stats {
    display: flex;
    gap: 20px;
    margin-top: 14px;
  }

  .stat {
    font-size: 11px;
    color: var(--muted);
  }

  .stat span {
    color: var(--accent);
    font-weight: 500;
  }

  .mode-tag {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: #e8f55e18;
    color: var(--accent);
    border: 1px solid #e8f55e33;
    padding: 3px 10px;
    border-radius: 99px;
  }

  footer {
    margin-top: 40px;
    font-size: 11px;
    color: #333;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<header>
  <h1>CASE<span>FLIP</span></h1>
  <p>paste · convert · copy &mdash; that's it</p>
</header>

<div class="card">
  <p class="label">Your text</p>
  <textarea id="input" placeholder="Paste your paragraph here..."></textarea>

  <div class="buttons">
    <button onclick="convert('upper')" id="btn-upper">UPPER CASE</button>
    <button onclick="convert('lower')" id="btn-lower">lower case</button>
    <button onclick="convert('title')" id="btn-title">Title Case</button>
    <button onclick="convert('sentence')" id="btn-sentence">Sentence case</button>
    <button onclick="convert('reverse')" id="btn-reverse">Reverse</button>
    <button onclick="convert('trim')" id="btn-trim">Remove Spaces</button>
    <button onclick="convert('alternating')" id="btn-alternating">aLtErNaTiNg</button>
    <button onclick="clearAll()" class="danger" style="margin-left:auto;">✕ Clear</button>
  </div>

  <div class="divider"></div>

  <div class="output-header">
    <p class="label" style="margin:0;">Result <span id="mode-tag" class="mode-tag" style="display:none;"></span></p>
    <button class="copy-btn" onclick="copyText()" id="copy-btn" style="display:none;">Copy ↗</button>
  </div>

  <div class="output-box" id="output">—</div>

  <div class="stats" id="stats" style="display:none;">
    <div class="stat">Characters: <span id="chars">0</span></div>
    <div class="stat">Words: <span id="words">0</span></div>
    <div class="stat">Sentences: <span id="sents">0</span></div>
  </div>
</div>

<script>
  let currentMode = null;

  const modes = {
    upper: 'UPPERCASE',
    lower: 'lowercase',
    title: 'Title Case',
    sentence: 'Sentence case',
    reverse: 'Reversed',
    trim: 'Spaces Removed',
    alternating: 'Alternating Case'
  };

  function convert(mode) {
    const input = document.getElementById('input').value;
    if (!input.trim()) { alert('Paste some text first!'); return; }

    let result = '';
    if (mode === 'upper') result = input.toUpperCase();
    else if (mode === 'lower') result = input.toLowerCase();
    else if (mode === 'title') result = input.replace(/\w\S*/g, t => t.charAt(0).toUpperCase() + t.slice(1).toLowerCase());
    else if (mode === 'sentence') result = input.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase());
    else if (mode === 'reverse') result = input.split('').reverse().join('');
    else if (mode === 'trim') result = input.replace(/[ \t]+/g, ' ').replace(/\n\s*\n/g, '\n').trim();
    else if (mode === 'alternating') result = input.split('').map((c, i) => i % 2 === 0 ? c.toLowerCase() : c.toUpperCase()).join('');

    document.getElementById('output').textContent = result;
    document.getElementById('output').classList.add('has-content');

    const tag = document.getElementById('mode-tag');
    tag.textContent = modes[mode];
    tag.style.display = 'inline';

    document.getElementById('copy-btn').style.display = 'inline-block';
    document.getElementById('stats').style.display = 'flex';
    document.getElementById('chars').textContent = result.length;
    document.getElementById('words').textContent = result.split(/\s+/).filter(Boolean).length;
    document.getElementById('sents').textContent = (result.match(/[.!?]+/g) || []).length || 1;

    document.querySelectorAll('.buttons button:not(.danger)').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + mode).classList.add('active');
    currentMode = mode;
  }

  function copyText() {
    const text = document.getElementById('output').textContent;
    if (text === '—') return;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.textContent = 'Copied! ✓';
      setTimeout(() => btn.textContent = 'Copy ↗', 2000);
    });
  }

  function clearAll() {
    document.getElementById('input').value = '';
    document.getElementById('output').textContent = '—';
    document.getElementById('output').classList.remove('has-content');
    document.getElementById('mode-tag').style.display = 'none';
    document.getElementById('copy-btn').style.display = 'none';
    document.getElementById('stats').style.display = 'none';
    document.querySelectorAll('.buttons button').forEach(b => b.classList.remove('active'));
  }
</script>
</body>
</html>
